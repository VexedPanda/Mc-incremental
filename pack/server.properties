# Mc-incremental Pack defaults (#46). Shipped with packwiz preserve = true: written on first
# install only, so server owners can change any of these. Minecraft fills in every other key.
# The Run area is 3x3 chunks; radius 2 covers it plus one surrounding chunk from its centre.
# view-distance: 2 is vanilla's floor (the server clamps to 2..32).
view-distance=2
# simulation-distance: the server accepts any value (no clamp), but entities only tick within
# this many chunks of a player, so 2 is the lowest that keeps the whole Run area ticking
# when the player stands in a corner chunk.
simulation-distance=2
